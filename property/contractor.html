<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stone Sheep">
<meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1d1a17" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
<script src="pwa.js" defer></script>
<title>Contractor App</title>
<meta name="description" content="The 64 Stone Sheep Circle contractor app (3D model, sheets, packets and crew chat), shown inside the property app.">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 16px; border-bottom: 1px solid var(--rule); font: 600 14px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; }
  .bar a { color: var(--ink); text-decoration: none; padding: 6px 0; }
  .bar a.out { color: var(--muted); font-size: 12px; }
  .bar b { color: var(--accent); }
  iframe { flex: 1; width: 100%; border: 0; display: block; }
</style>
<body data-own-nav>
<nav class="bar" aria-label="Contractor app">
  <a href="home.html">‹ Home</a>
  <b id="label">Contractor app</b>
  <a class="out" id="out" href="../contractor/" target="_blank" rel="noopener">Open on its own ↗</a>
</nav>
<iframe id="app" src="../contractor/" title="64 Stone Sheep Circle contractor app" allow="clipboard-write; fullscreen"></iframe>
<script>
  // contractor.html#3d (or #s1, #e1, #p1, #m1 ...) opens the app on that tab.
  (function () {
    const APP = '../contractor/';
    const frame = document.getElementById('app'), label = document.getElementById('label');
    function open() {
      const tab = location.hash.slice(1);
      frame.src = /^[a-z0-9]+$/.test(tab) ? APP + '#' + tab : APP;
      document.getElementById('out').href = frame.src;
      label.textContent = tab === '3d' ? '3D model' : 'Contractor app';
      document.title = label.textContent;
    }
    addEventListener('hashchange', open);
    open();
  })();
</script>
</body>
</html>
